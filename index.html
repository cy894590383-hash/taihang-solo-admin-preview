<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>太行SOLO 运营后台 · 一期 demo</title>
<style>
:root{
  --bg:#f5f6f8;--surface:#fff;--text:#202938;--muted:#697586;--subtle:#8b95a5;
  --line:#e7ebf0;--soft:#f8fafc;--blue:#2563eb;--blue-hover:#1d4ed8;--blue-soft:#eff6ff;
  --radius:10px;--control:36px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{height:100%;color-scheme:light}
body{font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--text);background:var(--bg);display:flex;height:100vh;height:100dvh;overflow:hidden;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit}
button,a,input,select{-webkit-tap-highlight-color:transparent}
button{height:var(--control);padding:0 14px;border:1px solid #dce1e8;border-radius:6px;background:var(--surface);color:var(--text);cursor:pointer;white-space:nowrap;flex-shrink:0;transition:background .15s,border-color .15s,color .15s}
button:hover:not(:disabled){background:var(--soft);border-color:#b8c2d0}
button:active:not(:disabled){background:#edf1f6}
button.pri{color:#fff;background:var(--blue);border-color:var(--blue)}
button.pri:hover:not(:disabled){background:var(--blue-hover);border-color:var(--blue-hover)}
button.link{height:auto;min-height:24px;border:none;background:none;color:var(--blue);padding:0;font-size:13px}
button.link:hover:not(:disabled){background:none;color:var(--blue-hover);text-decoration:underline;text-underline-offset:3px}
button:disabled{color:#a7afbc;background:#fafbfc;border-color:var(--line);cursor:not-allowed}
button.link:disabled{color:#a7afbc;background:none}
:where(button,a,input,select):focus-visible{outline:2px solid #93b4ff;outline-offset:3px}
input:not([type="checkbox"]),select{height:var(--control);min-width:0;padding:0 11px;border:1px solid #dce1e8;border-radius:6px;background:#fff;color:var(--text)}
input::placeholder{color:#919baa}
input:not([type="checkbox"]):hover,select:hover{border-color:#b8c2d0}
input:not([type="checkbox"]):focus,select:focus{border-color:#739cf6;outline:0;box-shadow:0 0 0 3px #2563eb12}
input[type="checkbox"]{width:14px;height:14px;vertical-align:middle;accent-color:var(--blue);cursor:pointer}
aside{width:200px;flex-shrink:0;background:#111827;color:#aeb8c7;display:flex;flex-direction:column}
aside h1{height:88px;display:flex;align-items:center;gap:10px;padding:20px 18px;color:#f8fafc;line-height:1.45;font-size:17px;font-weight:600;letter-spacing:.2px;flex-shrink:0}
aside .brand-logo{display:block;width:32px;height:32px;flex-shrink:0;color:#f8fafc}
aside .brand-copy{display:block;min-width:0;white-space:nowrap}
aside h1 small{display:block;margin-top:4px;color:#8793a6;font-size:11px;font-weight:400;letter-spacing:1px}
#nav{padding:0 10px 20px;overflow-y:auto}
aside a{position:relative;display:flex;align-items:center;gap:12px;min-height:44px;padding:10px 14px;margin:4px 0;border-radius:6px;color:inherit;cursor:pointer;white-space:nowrap;transition:background .15s,color .15s}
aside a:hover{background:#ffffff09;color:#f8fafc}
aside a.on{background:#ffffff12;color:#fff}
aside a.on::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:#7aa2ff}
aside .nav-icon{width:20px;height:20px;flex-shrink:0;opacity:.9}
main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
header{height:60px;min-height:60px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 28px;background:var(--surface);border-bottom:1px solid var(--line)}
.header-context{display:flex;align-items:center;gap:12px;min-width:0}
.breadcrumbs{min-width:0;font-size:13px}
.breadcrumbs ol{display:flex;align-items:center;gap:10px;list-style:none;margin:0;padding:0}
.breadcrumbs li{display:flex;align-items:center;gap:10px;min-width:0;white-space:nowrap}
.breadcrumbs .breadcrumb-separator{width:12px;height:12px;color:#bcc5d2;flex-shrink:0}
button.breadcrumb-link{height:auto;min-height:28px;padding:0;border:0;border-radius:2px;background:none;color:var(--muted);font-size:13px}
button.breadcrumb-link:hover:not(:disabled){background:none;color:var(--blue);text-decoration:underline;text-underline-offset:3px}
#current-page{font-size:13px;font-weight:500;white-space:nowrap;color:var(--text)}
.demo-badge{font-size:11px;line-height:22px;padding:0 7px;border:1px solid var(--line);border-radius:4px;color:var(--muted);white-space:nowrap}
.role-control{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);white-space:nowrap}
.role-control select{height:32px;padding:0 9px;font-size:12px}
#page{flex:1;min-height:0;padding:24px 28px 28px;overflow:auto}
.head{display:flex;align-items:center;gap:8px;min-height:36px;margin-bottom:20px;flex-shrink:0;flex-wrap:wrap}
.head h2{font-size:22px;font-weight:600;letter-spacing:-.35px;line-height:1.5;overflow-wrap:anywhere}
.sp{flex:1}
.tip{font-size:12px;color:var(--subtle);line-height:1.7}
.card{padding:20px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:20px;min-width:0}
.sec{margin:20px 0 14px;font-weight:600;font-size:15px;line-height:1.6}
.card .sec:first-child{margin-top:0}
.section-heading{display:flex;align-items:baseline;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.section-heading .sec{margin:0}
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:20px;flex-shrink:0}
.bar input,.bar select{font-size:14px}
.bar .ipt{max-width:100%}
.bar .ipt input{max-width:100%}
.bar .search-btn{color:var(--text);background:var(--soft)}
.ipt{position:relative;display:inline-block;min-width:0}
.ipt input{padding-right:30px!important}
.ipt .x{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:16px;height:16px;border:0;border-radius:50%;padding:0;background:#e5e9ef;color:#7d8797;font-size:10px;line-height:16px}
.ipt .x:hover{background:#dce2eb}
#page.fill{display:flex;flex-direction:column;overflow:hidden}
#page.fill .fillcard{flex:1;min-height:0;display:flex;flex-direction:column;margin-bottom:0}
.fillcard .tw{flex:1;min-height:0}
.fillcard .bar,.fillcard .pager,.fillcard .seg,.fillcard>p{flex-shrink:0}
.tw{position:relative;isolation:isolate;overflow:auto;max-width:100%;border:1px solid var(--line);border-radius:7px}
table{width:100%;border-collapse:separate;border-spacing:0;background:var(--surface);font-size:14px}
th,td{height:44px;padding:10px 14px;border-bottom:1px solid #edf0f4;text-align:left;white-space:nowrap;font-weight:400;line-height:1.7}
th{height:42px;background:var(--soft);color:var(--muted);font-size:13px;font-weight:500}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:#fafbfd}
.tw th{position:sticky;top:0;z-index:2}
.tw th.act,.tw td.act{position:sticky;right:0;background:var(--surface);box-shadow:-6px 0 8px -8px #27364f55}
.tw td.act{z-index:1}
.tw th.act{background:var(--soft);z-index:3}
.tw tbody tr:hover td.act{background:#fafbfd}
th.num,td.num{text-align:right}
td.num{font-variant-numeric:tabular-nums}
.row-actions{display:inline-flex;align-items:center;gap:16px}
.tag{display:inline-block;padding:1px 7px;line-height:20px;font-size:11px;font-weight:400;border-radius:4px;background:#f0f2f5;color:#697586}
.tag.g{background:#eef8f1;color:#388657}
.tag.r{background:#fff1f0;color:#c35a54}
.tag.b{background:#edf3ff;color:#416ab6}
.seg{display:inline-flex;align-self:flex-start;gap:4px;background:#f3f5f8;border:1px solid #edf0f4;border-radius:7px;padding:3px;margin-bottom:20px}
.seg button{height:30px;border:0;background:none;padding:0 16px;color:var(--muted);font-size:13px;border-radius:4px}
.seg button.on{background:#fff;color:var(--text);font-weight:500;box-shadow:0 1px 3px #16243b0b}
.pager{display:flex;align-items:center;justify-content:flex-end;gap:6px;flex-wrap:wrap;padding:16px 0 0;min-height:48px;font-size:12px;flex-shrink:0}
.pager b{font-weight:500;margin-right:4px}
.pager button{height:28px;min-width:28px;padding:0 7px;font-size:12px;border-color:transparent;color:var(--muted)}
.pager button.on{background:var(--blue-soft);border-color:transparent;color:var(--blue);font-weight:500}
.pager button:disabled{background:none;color:#c5ccd7;border-color:transparent}
.pager select{height:28px;padding:0 7px;font-size:12px}
.pager .tip{font-size:12px}
.empty{padding:48px 20px;text-align:center;color:var(--muted);line-height:1.8}
.empty-ico{display:flex;align-items:center;justify-content:center;width:36px;height:36px;margin:0 auto 10px;border-radius:8px;background:#f4f6f9;color:#acb6c6}
.empty-ico svg{width:22px;height:22px}
.empty b{font-size:13px;font-weight:500;color:var(--muted)}
.empty .tip{margin-top:3px}
.fillcard .tw:has(.empty) table{height:100%}
.fillcard .tw td:has(.empty){vertical-align:middle}
/* 基本信息按身份、关键数据、时间分组，让余额成为清晰的视觉落点。 */
.detail-card{padding:22px 24px 0}
.overview-main{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:32px;padding-bottom:20px}
.overview-identity{min-width:0}
.overview-caption{font-size:12px;font-weight:400;color:var(--muted);margin-bottom:5px}
.overview-name{font-size:18px;font-weight:600;line-height:1.5;overflow-wrap:anywhere;color:var(--text)}
.overview-meta{display:flex;align-items:baseline;flex-wrap:wrap;gap:6px 20px;margin-top:9px;font-size:13px;color:var(--text)}
.overview-meta .label{margin-right:7px;color:var(--muted);font-size:12px}
.overview-metrics{display:grid;grid-template-columns:repeat(3,max-content);align-items:start;gap:32px;padding-left:32px;border-left:1px solid var(--line)}
.overview-metric{min-width:90px}
.overview-metric dt{font-size:12px;color:var(--muted);font-weight:400;margin-bottom:8px;white-space:nowrap}
.overview-metric dd{font-size:16px;line-height:34px;white-space:nowrap;color:var(--text)}
.overview-metric.primary dd{font-size:28px;font-weight:600;letter-spacing:-.5px}
.overview-times{display:flex;flex-wrap:wrap;gap:8px 28px;border-top:1px solid var(--line);padding:13px 0 15px}
.overview-time{display:flex;align-items:baseline;gap:10px;line-height:1.7}
.overview-time dt{font-size:12px;font-weight:400;color:var(--muted)}
.overview-time dd{font-size:13px;color:var(--muted)}
@media(max-width:1050px){.overview-main{gap:24px}.overview-metrics{gap:20px;padding-left:24px}.overview-metric{min-width:76px}.overview-meta{gap:6px 12px}}
@media(max-width:900px){.overview-main{grid-template-columns:1fr;gap:20px}.overview-metrics{justify-content:start;border-left:0;border-top:1px solid var(--line);padding:18px 0 0;gap:32px}.overview-times{gap:8px 20px}}
@media(max-width:780px){.card.detail-card{padding:18px 18px 0}.overview-metrics{gap:24px;grid-template-columns:repeat(3,minmax(0,1fr));width:100%}.overview-metric{min-width:0}.overview-metric dd{font-size:14px}.overview-metric.primary dd{font-size:24px}.overview-name{font-size:17px}.overview-times{padding-bottom:14px}}
@media(max-width:480px){.overview-metrics{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:14px}.overview-metric:last-child{grid-column:1/-1}}
.detail-tabs{display:flex;align-items:center;gap:24px;border-bottom:1px solid var(--line);margin:-4px 0 20px;overflow-x:auto;flex-shrink:0}
.detail-tabs button{position:relative;height:43px;padding:0 0 13px;border:0;border-radius:0;background:none!important;color:var(--muted);font-size:14px}
.detail-tabs button.on{color:var(--blue);font-weight:500}
.detail-tabs button.on::after{content:"";position:absolute;bottom:0;left:0;right:0;height:2px;border-radius:2px;background:var(--blue)}
.tab-count{display:inline-block;min-width:18px;margin-left:6px;padding:0 5px;background:#f1f3f7;border-radius:4px;font-size:11px;line-height:18px;color:var(--muted);font-weight:400}
.detail-tabs button.on .tab-count{background:#edf3ff;color:var(--blue)}
.detail-note{margin:-4px 0 14px;font-size:12px;color:var(--muted);line-height:1.7}
.detail-panel .empty{padding:32px 20px}
.mask{position:fixed;z-index:1000;inset:0;display:none;align-items:center;justify-content:center;overflow:auto;background:#0f172a59;padding:24px 20px}
.dlg{display:flex;flex-direction:column;width:520px;max-width:100%;max-height:calc(100vh - 48px);max-height:calc(100dvh - 48px);background:#fff;border:1px solid #e4e8ee;border-radius:12px;overflow:hidden;box-shadow:0 20px 64px #0f172a24}
.dlg.wide{width:820px}
.dlg-hd{position:relative;flex-shrink:0;padding:20px 24px 16px;border-bottom:1px solid var(--line)}
.dlg-hd h3{padding-right:32px;font-size:16px;line-height:1.5;font-weight:600;overflow-wrap:anywhere}
.dlg-hd>button.link{margin-bottom:8px}
.dlg-x{position:absolute;top:14px;right:16px;width:28px;height:28px;border:0;background:none;color:var(--subtle);font-size:16px;padding:0;border-radius:5px}
.dlg-x:hover{color:var(--text)}
.dlg-bd{flex:1;min-height:0;padding:20px 24px;overflow:auto}
.ft{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:20px}
.dlg-ft{flex-shrink:0;padding:14px 24px;margin:0;border-top:1px solid var(--line);background:#fff}
.f{margin-bottom:18px}
.f:last-child{margin-bottom:0}
.f label{display:block;margin-bottom:7px;font-size:13px;color:#586475}
.f input,.f select{width:100%}
.row{display:flex;align-items:center;gap:8px}
.row input{flex:1;min-width:0}
.hint{font-size:12px;line-height:1.7;margin-top:6px}
.err{color:#c4504c}.ok{color:#388657}
.sum{padding:14px 16px;background:var(--soft);border:1px solid var(--line);border-radius:7px;font-size:13px;line-height:2;overflow-wrap:anywhere}
.sum b{font-weight:600}
.kv{width:100%;border-collapse:collapse}
.kv td{height:auto;white-space:normal;vertical-align:top;padding:11px 12px;border-bottom:1px solid #edf0f4;overflow-wrap:anywhere;line-height:1.8}
.kv td.k{width:28%;min-width:100px;color:var(--muted)}
.kv tr:hover td{background:none}
.kv tr:last-child td{border-bottom:0}
.toast{position:fixed;z-index:1100;top:20px;left:50%;transform:translateX(-50%);display:none;max-width:calc(100vw - 40px);padding:10px 16px;background:#202938;color:#fff;border-radius:7px;box-shadow:0 6px 24px #0f172a1a;font-size:13px}
.tipwrap{position:relative;display:inline-block}
.tipwrap button{pointer-events:none}
.tipwrap:hover::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 8px);right:0;background:#202938;color:#fff;font-size:12px;padding:6px 10px;border-radius:5px;white-space:nowrap;z-index:10}
.doc{max-width:1100px;padding:24px 28px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);font-size:14px;line-height:1.9}
.doc h3{font-size:16px;font-weight:600;margin:28px 0 10px;color:var(--text)}
.doc p,.doc li{margin:8px 0;color:#556173}
.doc p:first-child{margin-top:0}
.doc b{font-weight:600;color:#364152}
.doc ul{padding-left:20px}
.doc td{white-space:normal;vertical-align:top;min-width:100px;line-height:1.8}
.doc .tw{margin:14px 0}
.doc th{white-space:normal;min-width:100px}
body.ro .admin-only{display:none!important}
*{scrollbar-width:thin;scrollbar-color:#d6dce5 transparent}
aside *{scrollbar-color:#3f4b5f transparent}
@media(min-width:1600px){#page{padding:28px 32px 32px}header{padding:0 32px}}
@media(max-width:1150px){aside{width:184px}header{padding:0 20px}#page{padding:20px}.head h2{font-size:20px}.bar .sp{display:none}.bar input{max-width:210px}}
@media(max-width:780px){aside{width:64px}aside h1{height:72px;justify-content:center;padding:20px 0}aside .brand-logo{width:30px;height:30px}aside .brand-copy{display:none}#nav{padding:0 6px 16px}aside a{justify-content:center;padding:12px 0}aside a span{display:none}aside a.on::before{top:15px;bottom:15px}header{height:54px;min-height:54px;padding:0 16px;gap:10px}.header-context{gap:8px}.role-control{gap:6px}.demo-badge{display:none}#page{padding:18px 16px}.head{margin-bottom:16px}.head h2{font-size:19px;flex-basis:100%}.head>.sp{display:none}.card{padding:16px;margin-bottom:16px}.bar{gap:8px;margin-bottom:16px}.bar .ipt{flex:1 1 180px}.bar .ipt input{width:100%!important;max-width:none}.bar>select{max-width:100%}.pager{gap:4px}.pager .sp{display:none}.doc{padding:18px}.mask{padding:16px}.dlg{max-height:calc(100dvh - 32px)}.dlg-hd{padding:18px 20px 14px}.dlg-bd{padding:18px 20px}.dlg-ft{padding:12px 20px}.detail-tabs{gap:22px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.f label .req{color:#dc2626;margin-left:2px}
.f .radios{display:flex;gap:24px;padding:4px 0}
.f .radios label{display:inline-flex;align-items:center;gap:6px;margin:0;font-size:14px;color:#1f2937;cursor:pointer;white-space:nowrap}
.f .radios input{width:auto;height:auto;margin:0;padding:0;accent-color:#2563eb}
.f input:disabled{background:#f3f4f6;color:#6b7280;cursor:not-allowed}
.dr{position:relative;display:inline-block}
.dr-btn{background:#fff;white-space:nowrap}
.dr-btn.set{color:#1d4ed8;border-color:#93c5fd}
.dr-pop{position:absolute;top:calc(100% + 6px);left:0;z-index:30;display:flex;background:#fff;border:1px solid #e5e7eb;border-radius:8px;box-shadow:0 8px 24px rgba(15,23,42,.12)}
.dr-presets{display:flex;flex-direction:column;padding:8px;border-right:1px solid #f3f4f6;min-width:112px}
.dr-presets button{border:none;background:none;text-align:left;padding:7px 10px;border-radius:6px;color:#374151}
.dr-presets button:hover{background:#f3f4f6}
.dr-presets button.on{background:#eff6ff;color:#1d4ed8;font-weight:600}
.dr-custom{padding:14px 16px;display:flex;flex-direction:column;justify-content:space-between;gap:16px}
.dr-row{display:flex;align-items:flex-end;gap:8px}
.dr-row label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:#6b7280}
.dr-row input{padding:6px 8px;border:1px solid #d1d5db;border-radius:4px}
.dr-ft{display:flex;justify-content:flex-end;gap:8px}
.exp{width:20px;display:inline-block;text-align:center;margin-right:4px;font-size:14px;line-height:1}
.exp-sp{display:inline-block;width:20px}
tr.sub td{background:#fafbfc;color:#4b5563;font-size:13px}
td.sub-id{padding-left:34px}
.exp svg{width:16px;height:16px;vertical-align:-3px;transition:transform .15s}
.info-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 28px;background:#f8fafc;border:1px solid #eef1f5;border-radius:8px;padding:14px 18px}
.ig-k{font-size:12px;color:#6b7280;margin-bottom:2px}
.ig-v{font-size:14px;color:#111827;word-break:break-all}
.st-link{padding:0;border:none;background:none;cursor:pointer}
.st-link .tag{text-decoration:underline;text-underline-offset:2px}
</style>
</head>

const rec=(src,uidOf,acctOf,ph,extra,keys,cols,row)=>({get arr(){return typeof src==='function'?src():src},cols,row,

// 订单的积分过期时间：取这张订单发放的积分批次；未支付的订单还没发积分，显示 —
const ordExp=o=>{if(o.st!=='已支付')return '—';const {b}=findBatch(o.batch||'');if(b)return b.exp;
  const d=new Date(o.t.slice(0,10));d.setDate(d.getDate()+(o.type.startsWith('个人订阅')?30:180));return d.toISOString().slice(0,10)};
// 剩余积分：这一笔积分还剩多少，团队按全团队算（主账号手上 + 已分给成员还没用的）；未支付的订单显示 —
const remainOf=r=>{if(r.st&&r.st!=='已支付')return '—';const {b}=findBatch(r.batch||'');return b?n(b.left+(b.dist||0)):'—'};
// 排序：按时间倒序（最新在上）

// ---------- 详情（轻量的基本信息 + 明细页签） ----------
const detailOverview=({caption,name,identity,metrics,times})=>`<section class="card detail-card" aria-label="基本信息"><div class="overview-main"><div class="overview-identity"><div class="overview-caption">${caption}</div><div class="overview-name">${name}</div>${identity.map(line=>`<div class="overview-meta">${line.map(([label,value])=>`<span><span class="label">${label}</span>${value}</span>`).join('')}</div>`).join('')}</div><dl class="overview-metrics">${metrics.map(([label,value],i)=>`<div class="overview-metric${i===0?' primary':''}"><dt>${label}</dt><dd>${value}</dd></div>`).join('')}</dl></div><dl class="overview-times">${times.map(([label,value])=>`<div class="overview-time"><dt>${label}</dt><dd>${value}</dd></div>`).join('')}</dl></section>`;
function detailTabs(items,body,note=''){
  return `<div class="card detail-panel"><div class="detail-tabs" role="tablist" aria-label="详情明细">${items.map(([name,count])=>`<button id="detail-tab-${name}" role="tab" aria-selected="${detail.tab===name}" aria-controls="detail-content" class="${detail.tab===name?'on':''}" onclick="setDetailTab('${name}')">${name}<span class="tab-count">${count}</span></button>`).join('')}</div><div id="detail-content" role="tabpanel" aria-labelledby="detail-tab-${detail.tab}">${note?`<p class="detail-note">${note}</p>`:''}${body}</div></div>`

function setDetailTab(tab){detail.tab=tab;render()}
function userPage(id){

function teamPage(id){

// ---------- 积分批次工具 ----------
const findBatch=id=>{for(const t of teams){const b=t.batches.find(b=>b.id===id);if(b)return{b,t}}for(const k in ub){const b=ub[k].find(b=>b.id===id);if(b)return{b,uid:+k}}return{}};
const avail=rec=>{const {b}=findBatch(rec.batch);if(!b||b.exp<now().slice(0,10))return 0;return Math.max(0,b.left-(b.held||0))};

let bound=null;
function payFields(){return `
  <div class="f"><label>团队档位<span class="req">*</span></label><select id="tier" onchange="fillTier()">${TIERS.map((x,i)=>`<option value="${i}">${x.name} · ¥${n(x.price)} · ${n(x.pts)} 积分</option>`).join('')}</select></div>

  <div class="f"><label>付款凭证 / 合同编号<span class="req">*</span></label><input id="ref" placeholder="对公转账凭证号或合同编号"></div>
  <div class="f"><label>积分有效期（固定，不可修改）</label><input id="days" value="180 天" disabled></div>
  <div class="f"><label>备注</label><input id="note" placeholder="选填"></div>`}
function fillTier(){$('#amt').value=TIERS[$('#tier').value].price}
function createTeam(){
  bound=null;
  openDlg(`<h3>创建团队</h3>
  <div class="f"><label>主账号手机号<span class="req">*</span></label><div class="row"><input id="ph" placeholder="试试 13800000001 / 13800000002 / 13900000000"><button onclick="findUser()">查找</button></div><div id="phHint" class="hint"></div></div>
  ${payFields()}
  <div class="ft"><button onclick="closeDlg()">取消</button><button class="pri" onclick="confirmPay()">下一步</button></div>`);
}
function findUser(){
  const p=$('#ph').value.trim(),u=users.find(u=>u.phone===p),h=$('#phHint');bound=null;
  if(!u){h.className='hint err';h.textContent='该手机号未注册，请先让用户在平台注册';return}
  if(teams.some(t=>t.owner===u.id)){h.className='hint err';h.textContent='该用户已有团队，请在团队详情里充值（每个手机号最多 1 个团队）';return}
  bound=u;h.className='hint ok';h.textContent=`✓ ${u.nick}（用户ID ${u.id}），团队名称将为「${u.nick}的团队」`;
}
function readPay(){
  const tier=TIERS[$('#tier').value],ref=$('#ref').value.trim();
  if(!ref){toast('请填写付款凭证 / 合同编号');return null}
  return{tier,ref,amt:+$('#amt').value,days:+$('#days').value||180,note:$('#note').value};
}
let pending=null;
function confirmPay(teamId){
  if(!teamId&&!bound){toast('请先查找并确认主账号');return}
  const p=readPay();if(!p)return;pending={...p,teamId};
  // 记下填写页的原始输入，「← 上一步」时原样填回
  formVals={teamId,bound,vals:Object.fromEntries(['ph','tier','amt','ref','days','note'].map(k=>[k,$('#'+k)?$('#'+k).value:'']))};
  const who=teamId?teamName(teams.find(t=>t.id===teamId)):bound.nick+'的团队';
  openDlg(`<h3>${teamId?'确认充值':'确认创建团队'}</h3>
  <div class="sum">团队：${who}<br>主账号：${teamId?phone(U(teams.find(t=>t.id===teamId).owner).phone):phone(bound.phone)}<br>
  档位：${p.tier.name}　实付 ¥${n(p.amt)}<br>套餐积分：<b>${n(p.tier.pts)}</b><br>
  过期日期：${addDays(p.days)}<br>付款凭证 / 合同编号：${p.ref}</div>
  <div class="ft"><button onclick="backToForm()">← 上一步</button><span class="sp"></span><button onclick="closeDlg()">取消</button><button class="pri" onclick="doPay()">确认提交</button></div>`);
}
let formVals=null;
function backToForm(){
  const f=formVals;if(f.teamId)recharge(f.teamId);else createTeam();
  for(const k in f.vals)if($('#'+k))$('#'+k).value=f.vals[k];
  if(!f.teamId&&f.bound)findUser();
}
function recharge(id){
  openDlg(`<h3>团队充值 · ${teamName(teams.find(t=>t.id===id))}</h3>${payFields()}
  <div class="ft"><button onclick="closeDlg()">取消</button><button class="pri" onclick="confirmPay('${id}')">下一步</button></div>`);
}
function doPay(){
  const p=pending,t0=now(),bid='B'+(9000+Math.floor(Math.random()*999)),ono='O'+Date.now(),exp=addDays(p.days);
  let t;
  if(p.teamId){t=teams.find(x=>x.id===p.teamId)}
  else{t={id:'T'+(2001+teams.length),owner:bound.id,members:[[bound.id,'主账号','—',0]],paid:0,created:t0.slice(0,10),lastPay:'',batches:[]};teams.push(t)}
  t.members[0][3]+=p.tier.pts;t.paid+=p.amt;t.lastPay=t0.slice(0,10);
  t.batches.push({id:bid,pts:p.tier.pts,left:p.tier.pts,exp,src:'套餐 '+ono});
  orders.unshift({no:ono,uid:t.owner,acct:teamName(t),type:'团队会员（线下）',tier:p.tier.name,amt:p.amt,pts:p.tier.pts,pay:'线下对公',ref:p.ref,st:'已支付',t:t0,op:'admin-陈',batch:bid,wd:0});
  flows.unshift({t:t0,acct:teamName(t),uid:t.owner,type:'后台充值',d:p.tier.pts,bal:t.members[0][3],batch:bid,rel:ono,op:'admin-陈'});
  logs.unshift({t:t0,op:'admin-陈',type:p.teamId?'团队充值':'创建团队',obj:t.id,before:p.teamId?'—':'无团队',after:`${p.tier.name}，${n(p.tier.pts)} 积分，过期 ${exp}`,note:[p.ref,p.note].filter(Boolean).join('；')});
  closeDlg();render();
  toast(p.teamId?'充值成功':`团队已创建：用户打开前台账号列表即可切换到「${teamName(t)}」`);
}
const ME='13900000001';   // 当前登录的后台账号（手机号）
function acctDlg(i){
  const a=i==null?null:admins[i];
  openDlg(`<h3>${a?`权限调整 · ${a.name}（${a.acct}）`:'新增后台账号'}</h3>
  ${a?'':`<div class="f"><label>手机号<span class="req">*</span></label><input id="aAcct" placeholder="用这个手机号 + 验证码登录后台"></div><div class="f"><label>姓名<span class="req">*</span></label><input id="aName"></div>`}
  <div class="f"><label>角色<span class="req">*</span></label><select id="aRole"><option ${a&&a.role==='只读人员'?'selected':''}>只读人员</option><option ${a&&a.role==='管理员'?'selected':''}>管理员</option></select></div>
  <div class="ft"><button onclick="closeDlg()">取消</button><button class="pri" onclick="saveAcct(${i==null?'null':i})">保存</button></div>`);
}
function saveAcct(i){
  const r=$('#aRole').value,t0=now();
  if(i==null){
    const acct=$('#aAcct').value.trim(),name=$('#aName').value.trim();
    if(!/^1\d{10}$/.test(acct)){toast('请填写 11 位手机号');return}
    if(!name){toast('请填写姓名');return}
    if(admins.some(a=>a.acct===acct)){toast('该手机号已是后台账号');return}
    admins.push({acct,name,role:r,st:'启用',created:t0.slice(0,10),last:'—'});
    logs.unshift({t:t0,op:ME,type:'新增后台账号',obj:acct,before:'—',after:r,note:''});
  }else{
    const a=admins[i];if(a.role===r){closeDlg();return}
    logs.unshift({t:t0,op:ME,type:'权限调整',obj:a.acct,before:a.role,after:r,note:''});a.role=r;
  }
  closeDlg();render();toast('已保存');
}
function toggleAcct(i){
  const a=admins[i],before=a.st;a.st=before==='启用'?'停用':'启用';
  logs.unshift({t:now(),op:ME,type:a.st==='停用'?'停用后台账号':'启用后台账号',obj:a.acct,before,after:a.st,note:''});
  render();toast(a.st==='停用'?'已停用，该账号不能再登录后台':'已启用');
}
// ---------- 积分调整：正数增加（生成一个新批次）、负数扣减（按过期时间从早到晚扣，最多扣到当前可用） ----------
let adjTo=null;
const adjDays=()=>adjTo.teamId?180:30;   // 积分充值的有效期固定：个人 30 天、团队 180 天
const today=()=>now().slice(0,10);
// 可扣减的批次：个人账号的批次，或团队主账号手上的批次；不含已过期、不含预扣中
const adjBatches=()=>{const t=adjTo.teamId?teams.find(x=>x.id===adjTo.teamId):null;
  return (t?t.batches:(ub[adjTo.uid]||[])).filter(b=>b.exp>=today()&&b.left-(b.held||0)>0).sort((a,b)=>a.exp.localeCompare(b.exp))};
const adjAvail=()=>adjBatches().reduce((a,b)=>a+b.left-(b.held||0),0);
function adjDlg(uid,teamId){
  adjTo={uid,teamId};
  const t=teamId?teams.find(x=>x.id===teamId):null,u=t?U(t.owner):U(uid);
  const who=t?`${teamName(t)}（${t.id}）　主账号 ${u.nick}　${phone(u.phone)}`:`${u.nick}　${phone(u.phone)}（个人账号）`;
  openDlg(`<h3>积分调整</h3>
  <div class="sum">账号：${who}<br>当前可用：<b>${n(adjAvail())}</b>（不含预扣中）</div>
  <div class="f" style="margin-top:12px"><label>类型<span class="req">*</span></label>
    <div class="radios"><label><input type="radio" name="aType" value="充值" checked onchange="adjType()">积分充值</label><label><input type="radio" name="aType" value="回收" onchange="adjType()">积分回收</label></div></div>
  <div class="f"><label id="aPtsLbl"></label><input id="aPts" placeholder="填正整数"></div>
  <div class="f"><label>来源<span class="req">*</span></label><select id="aCat" onchange="adjCat()"></select></div>
  <div class="f"><label id="aWhyLbl">原因（选填）</label><input id="aWhy" placeholder="补充说明，如合同号、工单号"></div>
  <div class="f"><label>关联订单号（选填）</label><input id="aOrd"></div>
  <div class="ft"><button onclick="closeDlg()">取消</button><button class="pri" onclick="doAdj()">确认</button></div>`);
  adjType();
}
// 选「积分回收」时不显示有效期
const ADJ_CATS={充值:['赠送','补偿','内测','授信','其他'],回收:['退款','其他']};
function adjType(){const typ=$('input[name=aType]:checked').value;$('#aPtsLbl').innerHTML=(typ==='回收'?'积分':`积分（有效期 ${adjDays()} 天）`)+'<span class="req">*</span>';
  $('#aCat').innerHTML='<option value="">请选择</option>'+ADJ_CATS[typ].map(c=>`<option>${c}</option>`).join('');adjCat()}
// 来源选「其他」时原因必填
function adjCat(){$('#aWhyLbl').innerHTML=$('#aCat').value==='其他'?'原因<span class="req">*</span>':'原因（选填）'}
function doAdj(){
  const typ=$('input[name=aType]:checked').value,raw=$('#aPts').value.trim(),v=(typ==='回收'?-1:1)*(+raw),why=$('#aWhy').value.trim(),ordNo=$('#aOrd').value.trim();
  if(!/^\d+$/.test(raw)||+raw===0){toast('积分要填正整数');return}
  const cat=$('#aCat').value;
  if(!cat){toast('请选择来源');return}
  if(cat==='其他'&&!why){toast('来源选「其他」时请填写原因');return}
  const t=adjTo.teamId?teams.find(x=>x.id===adjTo.teamId):null,uid=t?t.owner:adjTo.uid,acct=t?teamName(t):'个人';
  if(ordNo){const o=orders.find(o=>o.no===ordNo);
    if(!o){toast('找不到该订单号');return}
    if(o.acct!==acct||o.uid!==uid){toast('该订单不属于这个账号');return}}
  const y=adjAvail();
  if(v<0&&-v>y){toast(`回收超过当前可用（${n(y)}）`);return}
  const t0=now(),gid='G'+(3001+gifts.length+Math.floor(Math.random()*900));let bid,exp='—';
  if(v>0){bid='B'+(9000+Math.floor(Math.random()*999));exp=addDays(t?180:30);
    const b={id:bid,pts:v,left:v,exp,src:'调整 '+gid};
    if(t){t.members[0][3]+=v;t.batches.push(b)}else{U(uid).pts+=v;(ub[uid]=ub[uid]||[]).push(b)}}
  else{let need=-v;const used=[];
    for(const b of adjBatches()){if(!need)break;const k=Math.min(need,b.left-(b.held||0));b.left-=k;need-=k;used.push(b.id)}
    bid=used.join(',');if(t)t.members[0][3]+=v;else U(uid).pts+=v}
  gifts.unshift({id:gid,t:t0,acct,uid,pts:v,exp,cat,why,ord:ordNo,op:'admin-陈',batch:v>0?bid:'',wd:0});
  flows.unshift({t:t0,acct,uid,type:'积分调整',d:v,bal:t?t.members[0][3]:U(uid).pts,batch:bid,rel:gid,op:'admin-陈'});
  logs.unshift({t:t0,op:'admin-陈',type:'积分调整',obj:t?t.id:uid,before:'—',after:`${acct} ${v>0?'+':''}${n(v)} 积分${v>0?'，过期 '+exp:''}`,note:[cat,why].filter(Boolean).join('：')});
  closeDlg();render();toast(`${v>0?'积分充值':'积分回收'}成功：${v>0?'+':''}${n(v)}`);
}
$('#mask').onclick=e=>{if(e.target.id==='mask')closeDlg()};
render();
</script>
</body>
